# MaaAutoNaruto Android PI 打包配方模板。
# 固定配置直接维护在本文件；机器相关路径由 tools/generate_pi_profile.py 填写。

########################################
# 不要直接拿本文件构建，也不要提交生成的 pi-profile.yaml。
# 请运行：python tools/generate_pi_profile.py
########################################

# 以下三个占位路径由 generate_pi_profile.py 替换。
assets: D:/path/to/your-pi

# MaaAutoNaruto 当前需要打进 APK 的 PI 资源。
include:
  - interface.json
  - tasks/**
  - resource/**
  - resource_*/**
  - data/**
  - locales/**
  - agent/**
  - CONTACT
  - LICENSE

exclude: []

# interface.json 只声明了一个 Python agent，因此这里只能有一个 runtime。
agent:
  sourceDir: D:/path/to/agent-dist
  abi: [arm64-v8a]

  runtimes:
    - location: bundle
      executable: bin/python3
      args: [-u, agent/main.py]
      env:
        PYTHONHOME: "{bundle}/prefix"
        PYTHONPATH: "{bundle}/site-packages/pure.zip:{bundle}/site-packages"
        LD_LIBRARY_PATH: "{bundle}/site-packages/chaquopy/lib:{bundle}/prefix/lib:{nativeLibs}"
        MAAFW_BINARY_PATH: "{nativeLibs}"

app:
  id: man
  label: MaaAutoNaruto
  icon: D:/path/to/your-pi/logo.png
