version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 1
    labels:
      - dependencies
      - automerge
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
    versioning-strategy: lockfile-only
    labels:
      - dependencies
      - automerge
