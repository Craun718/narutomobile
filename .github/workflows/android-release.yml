name: android-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Artifact version (defaults to the current ref)
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        description: Version used in artifact names
        required: true
        type: string
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      KEYSTORE_PASSWORD:
        required: false
      KEY_ALIAS:
        required: false
      KEY_PASSWORD:
        required: false

concurrency:
  group: android-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set_tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: set_tag
        run: |
          requested_version="${{ inputs.version }}"
          if [[ -n "$requested_version" ]]; then
            echo "tag=$requested_version" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi

          tag=$(git describe --tags --match "v*" ${{ github.ref }} || true)
          if [[ $tag != v* ]]; then
            tag=$(curl -sX GET "https://api.github.com/repos/${{ github.repository }}/releases/latest" --header 'authorization: Bearer ${{ secrets.GITHUB_TOKEN }}' | awk '/tag_name/{print $4}' FS='["]')
            if [[ $tag != v* ]]; then
              tag="v0.0.0"
            fi
            tag=$(date "+$tag-%y%m%d-$(git rev-parse --short HEAD)")
          fi

          prefix=${tag%-*-*}
          suffix=${tag#$prefix-}
          tag="$prefix-ci.$suffix"

          echo "tag=$tag" | tee -a "$GITHUB_OUTPUT"
  apk:
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13.15"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: Android/MaaFwApp/gradle/wrapper/gradle-wrapper.properties

      - uses: android-actions/setup-android@v4

      - name: Cache MaaFramework and agent core
        uses: actions/cache@v6
        with:
          path: |
            Android/MaaFwApp/.maa-cache
            Android/MaaFwApp/.maafw
          key: android-native-${{ runner.os }}-fw5.12.3-core3.13.15-all
          restore-keys: |
            android-native-${{ runner.os }}-fw5.12.3-core3.13.15-
            android-native-${{ runner.os }}-

      - name: Write local.properties
        run: |
          {
            echo "sdk.dir=${ANDROID_SDK_ROOT}"
            echo "pi.profile=../profile.yaml"
            echo "build.abi=${{ matrix.abi }}"
          } > Android/MaaFwApp/local.properties

      - name: Prepare PI tree
        run: python tools/prepare_android_pi.py

      - name: Fetch MaaFramework native libs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python Android/MaaFwApp/scripts/setup_maa_framework.py --abi ${{ matrix.abi }} --tag v5.12.3

      - name: Pack agent runtime
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python Android/MaaFwApp/scripts/build_agent_bundle.py --out Android/agent-dist \
            --requirements requirements.txt \
            --exclude pillow --exclude win32-setctime --exclude colorama --exclude jeepney \
            --require pillow==11.0.0 --extra-index-url https://chaquo.com/pypi-13.1/

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::warning::Android signing secrets are incomplete; the Release APK will be unsigned."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Assemble release APK
        working-directory: Android/MaaFwApp
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease -Pandroid.injected.build.abi=${{ matrix.abi }}

      - name: Rename APK
        shell: bash
        run: |
          mkdir -p android-artifacts
          apk_file=$(find Android/MaaFwApp/app/build/outputs -name "*.apk" | head -n 1)
          if [ -z "$apk_file" ]; then
            echo "APK file not found! Listing build outputs for debug:"
            find Android/MaaFwApp/app/build/outputs -type f | head -n 100
            exit 1
          fi
          cp "$apk_file" "android-artifacts/MaaAutoNaruto-android-${{ matrix.abi }}-${{ needs.meta.outputs.tag }}.apk"
          echo "Copied $apk_file to android-artifacts/"

      - uses: actions/upload-artifact@v7
        with:
          name: MaaAutoNaruto-android-${{ matrix.abi }}-${{ needs.meta.outputs.tag }}
          path: android-artifacts/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: MaaAutoNaruto-android-mapping-${{ matrix.abi }}-${{ needs.meta.outputs.tag }}
          path: Android/MaaFwApp/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
