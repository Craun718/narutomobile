name: release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  desktop:
    permissions:
      contents: read
    uses: ./.github/workflows/install.yml
    with:
      version: ${{ github.ref_name }}

  android:
    permissions:
      contents: read
    uses: ./.github/workflows/android-release.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit

  changelog:
    name: Generate changelog
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect prerelease
        id: release_type
        shell: bash
        run: |
          if [[ "${{ github.ref_name }}" =~ (alpha|beta|rc|dev) ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: .github/cliff.toml
          args: >-
            -vv --latest --strip header
            ${{ steps.release_type.outputs.is_prerelease == 'false' && '--tag-pattern "^v[0-9]+\\.[0-9]+\\.[0-9]+$"' || '' }}
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}

      - uses: actions/upload-artifact@v7
        with:
          name: release-changelog-${{ github.ref_name }}
          path: CHANGES.md
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [desktop, android, changelog]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: MaaAutoNaruto-win-*-${{ github.ref_name }}
          path: release-assets/desktop

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: MaaAutoNaruto-macos-*-${{ github.ref_name }}
          path: release-assets/desktop

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: MaaAutoNaruto-linux-*-${{ github.ref_name }}
          path: release-assets/desktop

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: MaaAutoNaruto-android-release-${{ github.ref_name }}
          path: release-assets/android

      - name: Download changelog
        uses: actions/download-artifact@v4
        with:
          name: release-changelog-${{ github.ref_name }}
          path: release-assets/changelog

      - name: Package desktop artifacts
        shell: bash
        run: |
          shopt -s nullglob
          for directory in release-assets/desktop/*; do
            name=$(basename "$directory")
            (cd "$directory" && zip -r "../../../$name.zip" .)
          done

      - name: Detect prerelease
        id: release_type
        shell: bash
        run: |
          if [[ "${{ github.ref_name }}" =~ (alpha|beta|rc|dev) ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: release-assets/changelog/CHANGES.md
          draft: false
          prerelease: ${{ steps.release_type.outputs.is_prerelease == 'true' }}
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            MaaAutoNaruto-*.zip
            release-assets/android/*.apk

      - name: Trigger MirrorChyan workflows
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run --repo "$GITHUB_REPOSITORY" mirrorchyan_release.yml -f tag="${{ github.ref_name }}"
          gh workflow run --repo "$GITHUB_REPOSITORY" mirrorchyan_release_note.yml -f tag="${{ github.ref_name }}"
