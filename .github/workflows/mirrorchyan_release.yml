name: mirrorchyan_release

on:
  workflow_dispatch:
    inputs:
      tag:
        default: ""
        required: false
  release:
    types: [released]

jobs:
  mirrorchyan:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: win
            arch: x86_64
            filename: "MaaAutoNaruto-win-x86_64-*.zip"
          - os: linux
            arch: x86_64
            filename: "MaaAutoNaruto-linux-x86_64-*.zip"
          - os: macos
            arch: x86_64
            filename: "MaaAutoNaruto-macos-x86_64-*.zip"
          - os: macos
            arch: aarch64
            filename: "MaaAutoNaruto-macos-aarch64-*.zip"
          - os: android
            arch: ""
            filename: "MaaAutoNaruto-android-*.apk"
    steps:
      - id: uploading
        uses: MirrorChyan/uploading-action@v1
        with:
          filetype: latest-release
          filename: ${{ matrix.filename }}
          mirrorchyan_rid: MaaAutoNaruto
          tag: ${{ inputs.tag }}

          owner: duorua
          repo: narutomobile
          github_token: ${{ secrets.GITHUB_TOKEN }}
          upload_token: ${{ secrets.MirrorChyanUploadToken }}
          os: ${{ matrix.os }}
          arch: ${{ matrix.arch }}

  mirrorchyan_res:
    runs-on: macos-latest
    steps:
      - id: uploading
        uses: MirrorChyan/uploading-action@v1
        with:
          filetype: latest-release
          filename: "MaaAutoNaruto-win-x86_64-*.zip"
          pick_files: '["resource", "interface.json", "agent", "python"]'
          exclude_files: '["resource/model/ocr/**"]'
          mirrorchyan_rid: MaaAutoNaruto
          tag: ${{ inputs.tag }}

          owner: duorua
          repo: narutomobile
          github_token: ${{ secrets.GITHUB_TOKEN }}
          upload_token: ${{ secrets.MirrorChyanUploadToken }}
